<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocktailCalc Pro — Расчёт закупок</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Georgia", "Times New Roman", serif;
            margin: 0; padding: 0; background: #f0e5d1; color: #601203; line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }

        header {
            background: #601203; color: #f0e5d1; padding: 28px; border-radius: 16px;
            margin-bottom: 28px; box-shadow: 0 4px 16px rgba(96, 18, 3, 0.25);
        }
        header h1 { margin: 0 0 6px; font-size: 1.8rem; font-weight: 400; letter-spacing: 1px; }
        header p { margin: 0 0 12px; font-size: 0.95rem; opacity: 0.85; }
        header nav a { color: #f0e5d1; text-decoration: none; margin-right: 18px; font-weight: 500; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        header nav a:hover { border-bottom-color: #f0e5d1; }

        main {
            background: #fffdf8; padding: 28px; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(96, 18, 3, 0.08); border: 1px solid #e6d8c0;
        }
        h2, h3 { margin-top: 0; color: #601203; font-weight: 400; }
        .hint { color: #8a6b55; font-size: 0.95rem; margin-top: 4px; }

        button {
            display: inline-block; background: #601203; color: #f0e5d1; border: 1px solid #601203;
            padding: 14px 32px; border-radius: 30px; font-size: 1rem; font-family: inherit;
            cursor: pointer; text-decoration: none; margin-top: 12px; transition: background 0.2s, color 0.2s;
        }
        button:hover { background: #f0e5d1; color: #601203; }

        input[type="number"] {
            width: 70px; padding: 10px; border: 1px solid #c9b89e; border-radius: 8px;
            font-size: 1rem; font-family: inherit; background: #fffdf8; color: #601203; text-align: center;
        }
        input[type="number"]:focus { outline: none; border-color: #601203; }

        .qty-btn {
            width: 32px; height: 32px; border: 1px solid #601203; background: #f0e5d1;
            color: #601203; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s; padding: 0;
        }
        .qty-btn:hover { background: #601203; color: #f0e5d1; }

        .cocktail-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 20px;
        }
        .cocktail-card {
            display: flex; align-items: center; gap: 10px; padding: 14px;
            border: 1px solid #d8c9b0; border-radius: 12px; cursor: pointer; background: #f7f1e6;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .cocktail-card:hover { border-color: #601203; box-shadow: 0 2px 8px rgba(96, 18, 3, 0.12); background: #fff8ea; }
        .cocktail-card.selected { border-color: #601203; background: #f0e5d1; }
        .cocktail-name { flex: 1; font-size: 1rem; }
        .cocktail-check { display: none; }

        .report {
            background: #f7f1e6; border: 1px solid #d8c9b0; border-radius: 12px; padding: 24px;
            margin-top: 24px; overflow-x: auto; white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace; font-size: 0.95rem; color: #601203; display: none;
        }
        .error { color: #c53030; margin-top: 12px; }
        .actions { margin-top: 20px; }

        footer { text-align: center; color: #8a6b55; margin-top: 28px; font-size: 0.9rem; }

        @media (max-width: 600px) {
            .cocktail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍹 CocktailCalc Pro</h1>
            <p>Расчёт закупок для выездного бара</p>
            <nav>
                <a href="index.html">Расчёт</a>
                <a href="admin.html">База</a>
            </nav>
        </header>
        <main>
            <h2>Выберите коктейли</h2>
            <p class="hint">Нажмите на карточку или укажите количество. Затем нажмите «Рассчитать».</p>

            <div id="cocktailGrid" class="cocktail-grid"></div>

            <div class="actions">
                <button onclick="calculate()">Рассчитать</button>
            </div>

            <div id="error" class="error"></div>
            <pre id="report" class="report"></pre>
        </main>
        <footer>
            <p>CocktailCalc Pro — Brilliant Event style</p>
        </footer>
    </div>

    <script src="db.js"></script>
    <script>
        const PF_PREFIX = "(ПФ) ";

        function stripPf(name) {
            return name.replace(PF_PREFIX, "").trim().toLowerCase();
        }

        function findCocktail(name) {
            name = name.toLowerCase().trim();
            if (DB.cocktails[name]) return name;
            for (let key in DB.cocktails) {
                if (name.includes(key) || key.includes(name)) return key;
            }
            return null;
        }

        function collectPfIngredients(ingredient, amount, collected, unknownPf) {
            const pfName = stripPf(ingredient);
            const pf = DB.semi_products[pfName];
            if (!pf) {
                unknownPf.push(pfName);
                return;
            }
            for (let [pfIng, pfRatio] of Object.entries(pf.recipe)) {
                const actualAmount = amount * (pfRatio / pf.output_volume);
                if (pfIng.startsWith(PF_PREFIX)) {
                    collectPfIngredients(pfIng, actualAmount, collected, unknownPf);
                } else {
                    collected[pfIng] = (collected[pfIng] || 0) + actualAmount;
                }
            }
        }

        function calculateShoppingList(order) {
            const alcohol = {}, nonAlcohol = {}, syrups = {}, puree = {}, concentrate = {}, dryGr = {};
            const iceCube = {}, iceFigurine = {}, decorationsPcs = {}, decorationsGr = {}, glassware = {};
            const pfToMake = {}, pfIngredients = {};
            const unknownCocktails = [], unknownPf = [], foundCocktails = [], detailedCalc = [];

            for (let [cocktailName, count] of Object.entries(order)) {
                const key = findCocktail(cocktailName);
                if (!key) {
                    unknownCocktails.push(cocktailName);
                    continue;
                }
                const cocktail = DB.cocktails[key];
                foundCocktails.push([cocktail.name, count]);
                const detail = {name: cocktail.name, count, ingredients: {}};

                for (let [ingredient, amountPer] of Object.entries(cocktail.recipe)) {
                    const totalAmount = amountPer * count;
                    detail.ingredients[ingredient] = totalAmount;
                    if (ingredient.startsWith(PF_PREFIX)) {
                        const pfName = stripPf(ingredient);
                        pfToMake[pfName] = (pfToMake[pfName] || 0) + totalAmount;
                        collectPfIngredients(ingredient, totalAmount, pfIngredients, unknownPf);
                    } else {
                        const category = DB.categories[ingredient] || "прочее";
                        if (category === "алкоголь") alcohol[ingredient] = (alcohol[ingredient] || 0) + totalAmount;
                        else if (category === "безалкогольное") nonAlcohol[ingredient] = (nonAlcohol[ingredient] || 0) + totalAmount;
                        else if (category === "сироп") syrups[ingredient] = (syrups[ingredient] || 0) + totalAmount;
                        else if (category === "пюре") puree[ingredient] = (puree[ingredient] || 0) + totalAmount;
                        else if (category === "концентрат") concentrate[ingredient] = (concentrate[ingredient] || 0) + totalAmount;
                        else if (category === "сухой_гр") dryGr[ingredient] = (dryGr[ingredient] || 0) + totalAmount;
                        else if (category === "лёд_кубик") iceCube[ingredient] = (iceCube[ingredient] || 0) + totalAmount;
                        else if (category === "лёд_фигурный") iceFigurine[ingredient] = (iceFigurine[ingredient] || 0) + totalAmount;
                        else if (category === "украшение_шт") decorationsPcs[ingredient] = (decorationsPcs[ingredient] || 0) + totalAmount;
                        else if (category === "украшение_гр") decorationsGr[ingredient] = (decorationsGr[ingredient] || 0) + totalAmount;
                    }
                }

                for (let [dec, amountPer] of Object.entries(cocktail.decorations || {})) {
                    const totalDec = amountPer * count;
                    detail.ingredients[dec] = totalDec;
                    const category = DB.categories[dec] || "украшение_шт";
                    if (category === "украшение_шт") decorationsPcs[dec] = (decorationsPcs[dec] || 0) + totalDec;
                    else if (category === "украшение_гр") decorationsGr[dec] = (decorationsGr[dec] || 0) + totalDec;
                }

                for (let [glass, amountPer] of Object.entries(cocktail.glassware || {})) {
                    const totalGlass = amountPer * count;
                    detail.ingredients[glass] = totalGlass;
                    glassware[glass] = (glassware[glass] || 0) + totalGlass;
                }

                detailedCalc.push(detail);
            }

            let totalCost = 0;

            function calcBottles(items) {
                const result = {};
                for (let [ing, amount] of Object.entries(items)) {
                    const bottleVol = DB.bottle_volumes[ing] || 0.7;
                    const bottles = bottleVol > 0 ? Math.ceil(amount / bottleVol) : 0;
                    const cost = bottles * (DB.prices[ing] || 0);
                    result[ing] = {liters: Math.round(amount * 1000) / 1000, bottles, bottleVol, cost};
                    totalCost += cost;
                }
                return result;
            }

            function calcPerLiter(items) {
                const result = {};
                for (let [ing, amount] of Object.entries(items)) {
                    const cost = Math.round(amount * (DB.prices[ing] || 0));
                    result[ing] = {liters: Math.round(amount * 1000) / 1000, cost};
                    totalCost += cost;
                }
                return result;
            }

            function calcPcs(items) {
                const result = {};
                for (let [ing, amount] of Object.entries(items)) {
                    const pcs = Math.ceil(amount);
                    const cost = pcs * (DB.prices[ing] || 0);
                    result[ing] = {pcs, cost};
                    totalCost += cost;
                }
                return result;
            }

            function calcGrams(items) {
                const result = {};
                for (let [ing, amount] of Object.entries(items)) {
                    const gr = Math.ceil(amount);
                    const price = DB.prices[ing] || 0;
                    const cost = price > 0 ? Math.round((gr / 1000) * price) : 0;
                    result[ing] = {gr, cost};
                    totalCost += cost;
                }
                return result;
            }

            return {
                found_cocktails: foundCocktails,
                unknown: unknownCocktails,
                unknown_pf: [...new Set(unknownPf)],
                detailed_calc: detailedCalc,
                pf_to_make: pfToMake,
                pf_ingredients: calcBottles(pfIngredients),
                alcohol: calcBottles(alcohol),
                non_alcohol: calcPerLiter(nonAlcohol),
                syrups: calcBottles(syrups),
                puree: calcPerLiter(puree),
                concentrate: calcPerLiter(concentrate),
                dry_gr: calcGrams(dryGr),
                ice_cube: calcPerLiter(iceCube),
                ice_figurine: calcPcs(iceFigurine),
                decorations_pcs: calcPcs(decorationsPcs),
                decorations_gr: calcGrams(decorationsGr),
                glassware: glassware,
                total_cost: Math.round(totalCost)
            };
        }

        function unitForIngredient(ing) {
            if (ing.startsWith(PF_PREFIX)) return "л";
            const category = DB.categories[ing] || "";
            const map = {
                "алкоголь": "л", "безалкогольное": "л", "сироп": "л", "пюре": "л", "концентрат": "л",
                "лёд_кубик": "кг", "лёд_фигурный": "шт", "украшение_шт": "шт", "украшение_гр": "гр",
                "сухой_гр": "гр", "посуда": "шт"
            };
            return map[category] || "л";
        }

        function formatReport(result) {
            const lines = [];
            lines.push("╔══════════════════════════════════════════════════╗");
            lines.push("║         🍹 ОТЧЁТ ПО ЗАКУПКАМ КОКТЕЙЛЕЙ          ║");
            lines.push("╚══════════════════════════════════════════════════╝");
            lines.push("");
            lines.push("📋 ЗАКАЗ:");
            for (let [name, count] of result.found_cocktails) lines.push(`   • ${name} — ${count} шт.`);
            if (result.unknown.length) lines.push(`⚠️  Не найдены: ${result.unknown.join(", ")}`);
            if (result.unknown_pf.length) lines.push(`⚠️  Неизвестные ПФ: ${result.unknown_pf.join(", ")}`);
            lines.push("");
            lines.push("─".repeat(50));
            lines.push("");

            lines.push("📊 ДЕТАЛЬНЫЙ РАСЧЁТ ПО КОКТЕЙЛЯМ:");
            lines.push("");
            for (let detail of result.detailed_calc) {
                lines.push(`▸ ${detail.name} × ${detail.count}:`);
                for (let [ing, amount] of Object.entries(detail.ingredients)) {
                    const unit = unitForIngredient(ing);
                    if (unit === "л") lines.push(`   ${ing}: ${amount.toFixed(3)} л`);
                    else if (unit === "кг") lines.push(`   ${ing}: ${amount.toFixed(2)} кг`);
                    else lines.push(`   ${ing}: ${Math.ceil(amount)} ${unit}`);
                }
                lines.push("");
            }
            lines.push("─".repeat(50));
            lines.push("");

            if (Object.keys(result.pf_to_make).length) {
                lines.push("🔧 ПОЛУФАБРИКАТЫ (нужно приготовить):");
                for (let [pf, amount] of Object.entries(result.pf_to_make)) lines.push(`   • (ПФ) ${pf}: ${amount.toFixed(3)} л`);
                lines.push("");
            }

            if (Object.keys(result.pf_ingredients).length) {
                lines.push("📦 ИНГРЕДИЕНТЫ ДЛЯ ПФ:");
                for (let [ing, data] of Object.entries(result.pf_ingredients).sort()) {
                    lines.push(`   • ${ing}: ${data.liters.toFixed(3)} л (${data.bottles} бут. × ${data.bottleVol} л) — ${data.cost} ₽`);
                }
                lines.push("");
            }
            lines.push("─".repeat(50));
            lines.push("");

            function appendBottles(title, items) {
                const keys = Object.keys(items);
                if (!keys.length) return;
                lines.push(title);
                for (let ing of keys.sort()) {
                    const data = items[ing];
                    lines.push(`   • ${ing}: ${data.liters.toFixed(3)} л (${data.bottles} бут. × ${data.bottleVol} л) — ${data.cost} ₽`);
                }
                lines.push("");
            }

            function appendLiters(title, items, unit = "л") {
                const keys = Object.keys(items);
                if (!keys.length) return;
                lines.push(title);
                for (let ing of keys.sort()) {
                    const data = items[ing];
                    const costStr = data.cost > 0 ? ` — ${data.cost} ₽` : "";
                    lines.push(`   • ${ing}: ${data.liters.toFixed(3)} ${unit}${costStr}`);
                }
                lines.push("");
            }

            function appendPcs(title, items) {
                const keys = Object.keys(items);
                if (!keys.length) return;
                lines.push(title);
                for (let ing of keys.sort()) {
                    const data = items[ing];
                    const costStr = data.cost > 0 ? ` — ${data.cost} ₽` : "";
                    lines.push(`   • ${ing}: ${data.pcs} шт${costStr}`);
                }
                lines.push("");
            }

            function appendGrams(title, items) {
                const keys = Object.keys(items);
                if (!keys.length) return;
                lines.push(title);
                for (let ing of keys.sort()) {
                    const data = items[ing];
                    const costStr = data.cost > 0 ? ` — ${data.cost} ₽` : "";
                    lines.push(`   • ${ing}: ${data.gr} гр${costStr}`);
                }
                lines.push("");
            }

            appendBottles("🥃 АЛКОГОЛЬ (закупить):", result.alcohol);
            appendLiters("🥤 Б/А — БЕЗАЛКОГОЛЬНОЕ (закупить):", result.non_alcohol);
            appendBottles("🧪 СИРОПЫ (закупить):", result.syrups);
            appendLiters("🍑 ПЮРЕ (закупить):", result.puree);
            appendLiters("🧃 КОНЦЕНТРАТЫ (закупить):", result.concentrate);
            appendGrams("🧂 СУХИЕ ИНГРЕДИЕНТЫ (закупить):", result.dry_gr);
            appendLiters("🧊 ЛЁД КУБИКОВЫЙ (закупить):", result.ice_cube, "кг");
            appendPcs("🧊 ЛЁД ФИГУРНЫЙ (закупить):", result.ice_figurine);
            appendPcs("🍒 УКРАШЕНИЯ (шт):", result.decorations_pcs);
            appendGrams("🧂 УКРАШЕНИЯ (гр):", result.decorations_gr);

            const glasses = Object.keys(result.glassware);
            if (glasses.length) {
                lines.push("🍷 ПОСУДА:");
                for (let glass of glasses.sort()) lines.push(`   • ${glass}: ${Math.ceil(result.glassware[glass])} шт`);
                lines.push("");
            }

            lines.push("═".repeat(50));
            lines.push(`💰 ИТОГО: ${result.total_cost} ₽`);
            lines.push("═".repeat(50));

            return lines.join("\n");
        }

        function getOrder() {
            const order = {};
            document.querySelectorAll(".cocktail-qty").forEach(qty => {
                const count = parseInt(qty.value) || 0;
                if (count > 0) order[qty.dataset.name] = count;
            });
            return order;
        }

        function calculate() {
            const errorDiv = document.getElementById("error");
            const reportPre = document.getElementById("report");
            errorDiv.textContent = "";

            const order = getOrder();
            if (!Object.keys(order).length) {
                errorDiv.textContent = "Выберите хотя бы один коктейль";
                reportPre.style.display = "none";
                return;
            }

            const result = calculateShoppingList(order);
            if (!result.found_cocktails.length) {
                errorDiv.textContent = "Коктейли не найдены";
                reportPre.style.display = "none";
                return;
            }

            reportPre.textContent = formatReport(result);
            reportPre.style.display = "block";
        }

        // Рендер карточек
        const grid = document.getElementById("cocktailGrid");
        for (let [key, cocktail] of Object.entries(DB.cocktails)) {
            const label = document.createElement("label");
            label.className = "cocktail-card";
            label.dataset.key = key;
            label.innerHTML = `
                <input type="checkbox" class="cocktail-check" data-name="${cocktail.name}">
                <span class="cocktail-name">${cocktail.name}</span>
                <button type="button" class="qty-btn minus">−</button>
                <input type="number" class="cocktail-qty" min="0" value="0" data-name="${cocktail.name}">
                <button type="button" class="qty-btn plus">+</button>
            `;
            grid.appendChild(label);
        }

        // Обработчики
        document.querySelectorAll(".cocktail-card").forEach(card => {
            const qty = card.querySelector(".cocktail-qty");
            const check = card.querySelector(".cocktail-check");
            const minus = card.querySelector(".minus");
            const plus = card.querySelector(".plus");

            function update() {
                const count = parseInt(qty.value) || 0;
                check.checked = count > 0;
                if (count > 0) card.classList.add("selected");
                else card.classList.remove("selected");
            }

            card.addEventListener("click", (e) => {
                if (e.target.closest("button") || e.target.closest("input")) return;
                const count = parseInt(qty.value) || 0;
                qty.value = count > 0 ? 0 : 1;
                update();
            });

            check.addEventListener("change", () => {
                qty.value = check.checked ? 1 : 0;
                update();
            });

            qty.addEventListener("change", () => {
                if ((parseInt(qty.value) || 0) < 0) qty.value = 0;
                update();
            });

            minus.addEventListener("click", (e) => {
                e.stopPropagation();
                let count = parseInt(qty.value) || 0;
                qty.value = Math.max(0, count - 1);
                update();
            });

            plus.addEventListener("click", (e) => {
                e.stopPropagation();
                let count = parseInt(qty.value) || 0;
                qty.value = count + 1;
                update();
            });
        });
    </script>
</body>
</html>
