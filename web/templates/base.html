<!DOCTYPE html>

    <title>{% block title %}Brilliant Event — CocktailCalc Pro{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

            <div class="logo">
                <span class="logo-main">Brilliant Event</span>

        <footer>
            <p>Brilliant Event — каждый напиток совершенен до блеска</p>
        </footer>
    </div>

</html>
